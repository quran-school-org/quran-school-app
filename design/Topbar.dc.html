<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الشريط العلوي</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;600;700&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<header dir="rtl" style="width: 100%; box-sizing: border-box; min-height: 76px; padding: 14px 32px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; background: #F8F8F3; border-bottom: 1px solid #D9DBD0; font-family: 'IBM Plex Sans Arabic', sans-serif; color: #1A1F2B">
  <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
    <span style="font-size: 13px; color: #6B7080">الخميس 8 أكتوبر 2026</span>
    <span style="font-size: 15px; font-weight: 600">الموسم الدراسي 2026–2027</span>
  </div>
  <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap">
    <span style="display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 999px; background: #E4EDDC; color: #2F5523; font-size: 13.5px; font-weight: 600">
      <span style="width: 8px; height: 8px; border-radius: 50%; background: #3F8A2E"></span>
      متزامن
    </span>
    <a href="Notifications.dc.html" class="tb-icon" aria-label="الإشعارات، {{bell}} غير مقروءة" style="position: relative; display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 12px; border: 1px solid #D9DBD0; background: #FFFFFF; color: #1B3A6B; text-decoration: none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
      <sc-if value="{{hasBell}}" hint-placeholder-val="{{ true }}">
        <span style="position: absolute; top: -6px; left: -6px; min-width: 22px; height: 22px; box-sizing: border-box; padding: 0 6px; border-radius: 999px; background: #A33A2E; color: #FFFFFF; font-size: 11.5px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; border: 2px solid #F8F8F3">{{bell}}</span>
      </sc-if>
    </a>
    <div style="display: flex; align-items: center; gap: 10px; padding-inline-start: 6px">
      <span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 50%; background: #1B3A6B; color: #F6EDD2; display: inline-flex; align-items: center; justify-content: center; font-family: 'Reem Kufi', sans-serif; font-weight: 700; font-size: 17px">م</span>
      <span style="display: flex; flex-direction: column; line-height: 1.3">
        <span style="font-size: 12.5px; color: #6B7080">المشرف العام</span>
        <span style="font-size: 14.5px; font-weight: 600">الشيخ محمد الهلالي الروضي</span>
      </span>
    </div>
    <button type="button" class="tb-out" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid #E8C9C3; background: #FFFFFF; color: #A33A2E; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: scaleX(-1)"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="m16 17 5-5-5-5"></path><path d="M21 12H9"></path></svg>
      خروج
    </button>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"bell":{"editor":"int","default":52},"$preview":{"width":1176,"height":76}}'>
class Component extends DCLogic {
  renderVals() {
    const bell = Number(this.props.bell ?? 52);
    return { bell, hasBell: bell > 0 };
  }
}
</script>
</body>
</html>
