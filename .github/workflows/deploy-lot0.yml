# Déploiement du LOT 0 (structure à la racine) depuis la branche release/lot0 (D64).
#
# - Déclenchement MANUEL uniquement (workflow_dispatch), par l'orchestrateur
#   (gh workflow run) après le « go » du propriétaire : docs/runbooks/OPERATIONS-CLAUDE.md.
# - Ce fichier vit sur main, mais le CODE déployé est toujours celui de
#   release/lot0 (checkout explicite, jamais une référence fournie en entrée) :
#   main contient le multi-écoles, qui ne doit pas partir en prod avant la bascule.
#   Le SHA vérifié par le premier job est exactement celui qui est déployé.
# - Garde-fous dans le workflow (forfait GitHub gratuit : pas de relecteur ni de
#   protection de branche) : production depuis main seulement, confirmation par
#   l'identifiant du projet, cible « all » refusée en production (ordre imposé
#   par le runbook : functions → script → règles → hosting), pas de --force
#   sauf demande explicite.
# - Authentification Google par WIF (compte github-deploy), sans clé JSON.
# - Configuration GitHub (D75) : environnements `dev` / `production` (Team,
#   Enterprise : job `deployer`) ou variables de dépôt préfixées DEV_ / PROD_
#   (Free : job `deployer-sans-environnement`, sans `environment:`), choisie par
#   le job `configuration`. Mêmes étapes (ancres YAML), un seul job s'exécute.
# - Durcissement (D55) : actions épinglées par SHA, aucune expression dans les
#   scripts (tout passe par env), job à jeton OIDC sans cache npm ni scripts
#   d'installation, persist-credentials: false.
name: Déploiement Lot 0 (release/lot0, manuel)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environnement GitHub (dev ou production)"
        type: choice
        options: [dev, production]
        default: dev
      target:
        description: "Cible (all : dev seulement)"
        type: choice
        options: [all, firestore-rules, functions, hosting]
        default: functions
      force:
        description: "Passer --force à firebase deploy (supprime les fonctions absentes du code de release/lot0)"
        type: boolean
        default: false
      confirm:
        description: "Production : recopier l'identifiant du projet pour confirmer"
        type: string
        required: false

permissions:
  contents: read

# Même groupe que deploy.yml : jamais deux déploiements simultanés sur un environnement.
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  LOT0_BRANCH: release/lot0
  PROD_PROJECT_ID: gen-lang-client-0481880143

jobs:
  # D75 : environnement GitHub (Team/Enterprise) ou variables de dépôt préfixées
  # (Free). Aucun jeton, aucune valeur sensible : ne lit que des variables.
  configuration:
    name: Configuration GitHub (environnement ou variables préfixées)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      prefix: ${{ steps.mode.outputs.prefix }}
      other_prefix: ${{ steps.mode.outputs.other_prefix }}
    steps:
      - name: Choix de la configuration
        id: mode
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          USE_GITHUB_ENVIRONMENTS: ${{ vars.USE_GITHUB_ENVIRONMENTS }}
          DEV_PROJECT: ${{ vars.DEV_FIREBASE_PROJECT_ID }}
          PROD_PROJECT: ${{ vars.PROD_FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          case "${ENVIRONMENT}" in
            dev) PREFIX=DEV_; OTHER=PROD_ ;;
            production) PREFIX=PROD_; OTHER=DEV_ ;;
            *) fail "Environnement inconnu." ;;
          esac
          # USE_GITHUB_ENVIRONMENTS (variable de dépôt, facultative) force le mode ;
          # sinon, la présence d'une variable préfixée signale la configuration Free.
          case "${USE_GITHUB_ENVIRONMENTS}" in
            true) MODE=environnement ;;
            false) MODE=prefixe ;;
            "") if [ -n "${DEV_PROJECT}${PROD_PROJECT}" ]; then MODE=prefixe; else MODE=environnement; fi ;;
            *) fail "USE_GITHUB_ENVIRONMENTS doit valoir true, false, ou être absente." ;;
          esac
          if [ "${MODE}" = "environnement" ]; then
            VAR_PREFIX=""
            MSG="environnement GitHub « ${ENVIRONMENT} » (variables sans préfixe)"
          else
            VAR_PREFIX="${PREFIX}"
            MSG="variables de dépôt ${PREFIX}* (sans environnement GitHub)"
          fi
          { echo "mode=${MODE}"; echo "prefix=${VAR_PREFIX}"; echo "other_prefix=${OTHER}"; } >> "$GITHUB_OUTPUT"
          echo "Configuration : ${MSG}."
          echo "- configuration GitHub : ${MSG}" >> "$GITHUB_STEP_SUMMARY"

  verifier:
    name: Build et tests de release/lot0
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      sha: ${{ steps.code.outputs.sha }}
    env:
      GCLOUD_PROJECT: demo-quran-school
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/lot0
          persist-credentials: false

      - name: Version du code
        id: code
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Code de ${LOT0_BRANCH} : ${SHA}"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      # Java est requis par l'émulateur Firestore.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm ci --prefix functions

      - name: Lint, build et tests (scripts présents dans release/lot0)
        run: |
          set -euo pipefail
          # N'exécute que les scripts npm définis dans la branche (sa liste peut différer de main).
          run_if_present() {
            if node -e 'process.exit(require("./package.json").scripts?.[process.argv[1]] ? 0 : 1)' "$1"; then
              echo "::group::npm run $1"; npm run "$1"; echo "::endgroup::"
            else
              echo "::notice::Script npm absent de ${LOT0_BRANCH} : $1 (ignoré)"
            fi
          }
          for s in lint lint:functions build build:functions test test:rules; do run_if_present "$s"; done

  # Job à jeton OIDC, version « environnement GitHub » (Team/Enterprise).
  deployer:
    name: Déploiement Lot 0 (${{ inputs.environment }} / ${{ inputs.target }})
    needs: [verifier, configuration]
    if: needs.configuration.outputs.mode == 'environnement'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: ${{ inputs.environment }}
    permissions: &deployer_permissions
      contents: read
      id-token: write # jeton OIDC pour la fédération d'identité
    # Variables lues sous le préfixe choisi par `configuration` : vide (variables
    # de l'environnement) ou DEV_ / PROD_ selon inputs.environment, jamais l'autre.
    env: &deployer_env
      ENVIRONMENT: ${{ inputs.environment }}
      TARGET: ${{ inputs.target }}
      FORCE: ${{ inputs.force }}
      LOT0_SHA: ${{ needs.verifier.outputs.sha }}
      CONFIG_MODE: ${{ needs.configuration.outputs.mode }}
      VAR_PREFIX: ${{ needs.configuration.outputs.prefix }}
      OTHER_PREFIX: ${{ needs.configuration.outputs.other_prefix }}
      PROJECT_ID: ${{ (needs.configuration.outputs.prefix == 'DEV_' && vars.DEV_FIREBASE_PROJECT_ID) || (needs.configuration.outputs.prefix == 'PROD_' && vars.PROD_FIREBASE_PROJECT_ID) || (needs.configuration.outputs.prefix == '' && vars.FIREBASE_PROJECT_ID) || '' }}
      DATABASE_ID: ${{ (needs.configuration.outputs.prefix == 'DEV_' && vars.DEV_FIRESTORE_DATABASE_ID) || (needs.configuration.outputs.prefix == 'PROD_' && vars.PROD_FIRESTORE_DATABASE_ID) || (needs.configuration.outputs.prefix == '' && vars.FIRESTORE_DATABASE_ID) || '' }}
      WIF_PROVIDER: ${{ (needs.configuration.outputs.prefix == 'DEV_' && vars.DEV_GCP_WIF_PROVIDER) || (needs.configuration.outputs.prefix == 'PROD_' && vars.PROD_GCP_WIF_PROVIDER) || (needs.configuration.outputs.prefix == '' && vars.GCP_WIF_PROVIDER) || '' }}
      DEPLOY_SA: ${{ (needs.configuration.outputs.prefix == 'DEV_' && vars.DEV_GCP_DEPLOY_SERVICE_ACCOUNT) || (needs.configuration.outputs.prefix == 'PROD_' && vars.PROD_GCP_DEPLOY_SERVICE_ACCOUNT) || (needs.configuration.outputs.prefix == '' && vars.GCP_DEPLOY_SERVICE_ACCOUNT) || '' }}
      # Valeurs de l'AUTRE environnement (variables préfixées), pour le contrôle croisé.
      OTHER_PROJECT_ID: ${{ (needs.configuration.outputs.other_prefix == 'DEV_' && vars.DEV_FIREBASE_PROJECT_ID) || (needs.configuration.outputs.other_prefix == 'PROD_' && vars.PROD_FIREBASE_PROJECT_ID) || '' }}
      OTHER_WIF_PROVIDER: ${{ (needs.configuration.outputs.other_prefix == 'DEV_' && vars.DEV_GCP_WIF_PROVIDER) || (needs.configuration.outputs.other_prefix == 'PROD_' && vars.PROD_GCP_WIF_PROVIDER) || '' }}
      OTHER_DEPLOY_SA: ${{ (needs.configuration.outputs.other_prefix == 'DEV_' && vars.DEV_GCP_DEPLOY_SERVICE_ACCOUNT) || (needs.configuration.outputs.other_prefix == 'PROD_' && vars.PROD_GCP_DEPLOY_SERVICE_ACCOUNT) || '' }}
    steps: &deployer_steps
      - name: Garde-fous
        env:
          CONFIRM: ${{ inputs.confirm }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          case "${ENVIRONMENT}" in dev|production) ;; *) fail "Environnement inconnu.";; esac
          case "${TARGET}" in all|firestore-rules|functions|hosting) ;; *) fail "Cible inconnue.";; esac
          # D75 : les variables DEV_* ne servent jamais à la production, ni PROD_* au dev.
          case "${CONFIG_MODE}:${ENVIRONMENT}:${VAR_PREFIX}:${OTHER_PREFIX}" in
            environnement:dev::PROD_|environnement:production::DEV_|prefixe:dev:DEV_:PROD_|prefixe:production:PROD_:DEV_) ;;
            *) fail "Configuration incohérente (mode « ${CONFIG_MODE} », préfixe « ${VAR_PREFIX} ») pour ${ENVIRONMENT}.";;
          esac
          if [ -z "${PROJECT_ID}" ] || [ -z "${DATABASE_ID}" ] || [ -z "${WIF_PROVIDER}" ] || [ -z "${DEPLOY_SA}" ]; then
            fail "Variables ${VAR_PREFIX}FIREBASE_PROJECT_ID, ${VAR_PREFIX}FIRESTORE_DATABASE_ID, ${VAR_PREFIX}GCP_WIF_PROVIDER ou ${VAR_PREFIX}GCP_DEPLOY_SERVICE_ACCOUNT absentes (${CONFIG_MODE}, ${ENVIRONMENT}). Voir docs/GUIDE-MISE-EN-PROD.md, étape 3."
          fi
          for v in PROJECT_ID WIF_PROVIDER DEPLOY_SA; do
            o="OTHER_${v}"
            if [ -n "${!o}" ] && [ "${!v}" = "${!o}" ]; then
              fail "${v} de ${ENVIRONMENT} est égal à la variable ${OTHER_PREFIX}* de l'autre environnement : configuration croisée."
            fi
          done
          [[ "${PROJECT_ID}" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]] || fail "FIREBASE_PROJECT_ID invalide."
          [[ "${DATABASE_ID}" =~ ^(\(default\)|[a-z][a-z0-9-]{2,62})$ ]] || fail "FIRESTORE_DATABASE_ID invalide."
          [[ "${LOT0_SHA}" =~ ^[0-9a-f]{40}$ ]] || fail "SHA de ${LOT0_BRANCH} absent."
          case "${PROJECT_ID}" in demo-*) fail "Projet demo-* : rien à déployer.";; esac
          case "${DEPLOY_SA}" in *"@${PROJECT_ID}.iam.gserviceaccount.com") ;; *) fail "Le compte de déploiement n'appartient pas au projet ${PROJECT_ID}.";; esac
          if [ "${ENVIRONMENT}" = "production" ]; then
            [ "${REF}" = "refs/heads/main" ] || fail "La production ne se lance que depuis le workflow de main (reçu : ${REF})."
            [ "${PROJECT_ID}" = "${PROD_PROJECT_ID}" ] || fail "L'environnement production ne vise pas ${PROD_PROJECT_ID}."
            [ "${CONFIRM}" = "${PROJECT_ID}" ] || fail "Confirmation incorrecte : recopier l'identifiant du projet de prod dans « confirm »."
            # Ordre du runbook Lot 0 : functions (avant la fenêtre), script, règles, hosting.
            [ "${TARGET}" != "all" ] || fail "Cible « all » refusée en production : déployer functions, puis (après lot0-provision) firestore-rules, puis hosting."
          else
            [ "${PROJECT_ID}" != "${PROD_PROJECT_ID}" ] || fail "L'environnement dev pointe vers la prod."
          fi
          echo "Déploiement de ${LOT0_BRANCH}@${LOT0_SHA} vers ${PROJECT_ID} (${ENVIRONMENT}, configuration ${CONFIG_MODE}${VAR_PREFIX:+ ${VAR_PREFIX}*}), cible ${TARGET}, force=${FORCE}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verifier.outputs.sha }}
          persist-credentials: false

      # Pas de cache npm partagé dans le job qui détient le jeton OIDC.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Sans scripts d'installation (vérifié : build, build des Functions et CLI
      # Firebase de release/lot0 fonctionnent avec --ignore-scripts).
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix functions --ignore-scripts

      - name: Configuration du projet visé (base nommée, Functions)
        env:
          VITE_FIREBASE_API_KEY: ${{ (needs.configuration.outputs.prefix == 'DEV_' && vars.DEV_VITE_FIREBASE_API_KEY) || (needs.configuration.outputs.prefix == 'PROD_' && vars.PROD_VITE_FIREBASE_API_KEY) || (needs.configuration.outputs.prefix == '' && vars.VITE_FIREBASE_API_KEY) || '' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ (needs.configuration.outputs.prefix == 'DEV_' && vars.DEV_VITE_FIREBASE_AUTH_DOMAIN) || (needs.configuration.outputs.prefix == 'PROD_' && vars.PROD_VITE_FIREBASE_AUTH_DOMAIN) || (needs.configuration.outputs.prefix == '' && vars.VITE_FIREBASE_AUTH_DOMAIN) || '' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ (needs.configuration.outputs.prefix == 'DEV_' && vars.DEV_VITE_FIREBASE_STORAGE_BUCKET) || (needs.configuration.outputs.prefix == 'PROD_' && vars.PROD_VITE_FIREBASE_STORAGE_BUCKET) || (needs.configuration.outputs.prefix == '' && vars.VITE_FIREBASE_STORAGE_BUCKET) || '' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ (needs.configuration.outputs.prefix == 'DEV_' && vars.DEV_VITE_FIREBASE_MESSAGING_SENDER_ID) || (needs.configuration.outputs.prefix == 'PROD_' && vars.PROD_VITE_FIREBASE_MESSAGING_SENDER_ID) || (needs.configuration.outputs.prefix == '' && vars.VITE_FIREBASE_MESSAGING_SENDER_ID) || '' }}
          VITE_FIREBASE_APP_ID: ${{ (needs.configuration.outputs.prefix == 'DEV_' && vars.DEV_VITE_FIREBASE_APP_ID) || (needs.configuration.outputs.prefix == 'PROD_' && vars.PROD_VITE_FIREBASE_APP_ID) || (needs.configuration.outputs.prefix == '' && vars.VITE_FIREBASE_APP_ID) || '' }}
          TRIGGER_REGION: ${{ (needs.configuration.outputs.prefix == 'DEV_' && vars.DEV_FUNCTIONS_TRIGGER_REGION) || (needs.configuration.outputs.prefix == 'PROD_' && vars.PROD_FUNCTIONS_TRIGGER_REGION) || (needs.configuration.outputs.prefix == '' && vars.FUNCTIONS_TRIGGER_REGION) || '' }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          : "${VITE_FIREBASE_API_KEY:=}" "${VITE_FIREBASE_AUTH_DOMAIN:=}" "${VITE_FIREBASE_STORAGE_BUCKET:=}"
          : "${VITE_FIREBASE_MESSAGING_SENDER_ID:=}" "${VITE_FIREBASE_APP_ID:=}" "${TRIGGER_REGION:=}"
          # 1) firebase.json de release/lot0 : règles déployées sur la base NOMMÉE attendue.
          RULES_DB=$(node -e 'const f=require("./firebase.json");const fs=[].concat(f.firestore||[]);console.log(fs.map(x=>x.database||"(default)").join(","))')
          [ "${RULES_DB}" = "${DATABASE_ID}" ] || fail "firebase.json cible la base « ${RULES_DB} », attendu « ${DATABASE_ID} »."
          ENV_FILE="functions/.env.${PROJECT_ID}"
          if [ "${ENVIRONMENT}" = "dev" ]; then
            # 2a) Front : .env.production.local surcharge .env.production (Vite) → projet de dev.
            for v in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_APP_ID; do
              [ -n "${!v}" ] || fail "Variable ${VAR_PREFIX}${v} absente (dev, configuration ${CONFIG_MODE} ; guide, étape 3)."
            done
            # Région des triggers : obligatoire pour le dev, aucune valeur par défaut
            # (une région incompatible avec l'emplacement de la base fait échouer les triggers).
            [ -n "${TRIGGER_REGION}" ] || fail "Variable ${VAR_PREFIX}FUNCTIONS_TRIGGER_REGION absente (dev ; région des triggers Firestore, ex. europe-west2 : guide, étape 3)."
            {
              echo "VITE_FIREBASE_API_KEY=\"${VITE_FIREBASE_API_KEY}\""
              echo "VITE_FIREBASE_AUTH_DOMAIN=\"${VITE_FIREBASE_AUTH_DOMAIN}\""
              echo "VITE_FIREBASE_PROJECT_ID=\"${PROJECT_ID}\""
              echo "VITE_FIREBASE_STORAGE_BUCKET=\"${VITE_FIREBASE_STORAGE_BUCKET}\""
              echo "VITE_FIREBASE_MESSAGING_SENDER_ID=\"${VITE_FIREBASE_MESSAGING_SENDER_ID}\""
              echo "VITE_FIREBASE_APP_ID=\"${VITE_FIREBASE_APP_ID}\""
              echo "VITE_FIRESTORE_DATABASE_ID=\"${DATABASE_ID}\""
              echo 'VITE_USE_EMULATORS="false"'
            } > .env.production.local
            # 2b) Paramètres non secrets des Functions (release/lot0 ne versionne que demo et prod).
            if [ ! -f "${ENV_FILE}" ]; then
              {
                echo "FIRESTORE_DATABASE_ID=${DATABASE_ID}"
                echo "FIRESTORE_TRIGGER_REGION=${TRIGGER_REGION}"
              } > "${ENV_FILE}"
            fi
          else
            # 2c) Production : configuration versionnée dans release/lot0, contrôlée.
            grep -qx "VITE_FIREBASE_PROJECT_ID=\"${PROJECT_ID}\"" .env.production || fail ".env.production ne vise pas ${PROJECT_ID}."
            grep -qx "VITE_FIRESTORE_DATABASE_ID=\"${DATABASE_ID}\"" .env.production || fail ".env.production ne vise pas la base ${DATABASE_ID}."
            [ -f "${ENV_FILE}" ] || fail "${ENV_FILE} absent de ${LOT0_BRANCH}."
          fi
          grep -qx "FIRESTORE_DATABASE_ID=\"\{0,1\}${DATABASE_ID}\"\{0,1\}" "${ENV_FILE}" || fail "${ENV_FILE} : FIRESTORE_DATABASE_ID différent de ${DATABASE_ID}."
          # 3) Région des triggers : variable FUNCTIONS_TRIGGER_REGION (préfixée en Free),
          #    obligatoire en dev, prioritaire sur le fichier versionné en production si
          #    elle est posée (valeur conseillée par l'action describe-db d'ops.yml).
          if [ -n "${TRIGGER_REGION}" ]; then
            [[ "${TRIGGER_REGION}" =~ ^[a-z]+-[a-z]+[0-9]+$ ]] || fail "${VAR_PREFIX}FUNCTIONS_TRIGGER_REGION invalide."
            sed -i '/^FIRESTORE_TRIGGER_REGION=/d' "${ENV_FILE}"
            echo "FIRESTORE_TRIGGER_REGION=${TRIGGER_REGION}" >> "${ENV_FILE}"
          fi
          # Jamais de repli silencieux : une seule région, explicite et valide.
          REGIONS=$(grep -c '^FIRESTORE_TRIGGER_REGION=' "${ENV_FILE}" || true)
          [ "${REGIONS}" = "1" ] || fail "${ENV_FILE} : ${REGIONS} ligne(s) FIRESTORE_TRIGGER_REGION, une seule attendue."
          grep -qE '^FIRESTORE_TRIGGER_REGION="?[a-z]+-[a-z]+[0-9]+"?$' "${ENV_FILE}" || fail "${ENV_FILE} : FIRESTORE_TRIGGER_REGION absente ou invalide."
          echo "Paramètres des Functions (${ENV_FILE}, aucun secret) :"
          grep -E '^[A-Z_]+=' "${ENV_FILE}"

      - name: Build de l'application
        run: npm run build

      # Contrôle sur la configuration inlinée par Vite (import.meta.env), pas sur le
      # texte : App.tsx de release/lot0 affiche l'identifiant de la prod dans une aide.
      - name: Contrôle du projet visé par le bundle
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          PROJECTS=$(grep -ho 'VITE_FIREBASE_PROJECT_ID:"[^"]*"' dist/assets/*.js | sort -u)
          [ "${PROJECTS}" = "VITE_FIREBASE_PROJECT_ID:\"${PROJECT_ID}\"" ] || fail "Le bundle ne vise pas ${PROJECT_ID} (trouvé : ${PROJECTS:-rien})."
          DATABASES=$(grep -ho 'VITE_FIRESTORE_DATABASE_ID:"[^"]*"' dist/assets/*.js | sort -u)
          [ "${DATABASES}" = "VITE_FIRESTORE_DATABASE_ID:\"${DATABASE_ID}\"" ] || fail "Le bundle ne vise pas la base ${DATABASE_ID} (trouvé : ${DATABASES:-rien})."
          grep -q 'VITE_USE_EMULATORS:"false"' dist/assets/*.js || fail "Bundle branché sur les émulateurs."

      - name: Authentification Google (Workload Identity Federation, sans clé)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
          create_credentials_file: true

      - name: Déploiement Firebase
        run: |
          set -euo pipefail
          FORCE_FLAG=()
          [ "${FORCE}" = "true" ] && FORCE_FLAG=(--force)
          deploy_one() {
            local only="$1" log="${RUNNER_TEMP}/deploy-${1//:/-}.log" code
            echo "::group::firebase deploy --only ${only}"
            set +e
            npx firebase deploy --only "${only}" --project "${PROJECT_ID}" --non-interactive "${FORCE_FLAG[@]}" \
              --message "Lot 0 ${LOT0_SHA::7} (GitHub Actions, ${GITHUB_ACTOR})" 2>&1 | tee "${log}"
            code=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"
            if [ "${code}" -ne 0 ]; then
              # Fonctions DÉPLOYÉES, seule la politique de nettoyage des images manque
              # (le compte n'a pas le droit de la poser) : avertissement, pas un échec.
              if [ "${only}" = "functions" ] && grep -q "Functions successfully deployed but could not set up cleanup policy" "${log}"; then
                echo "::warning::Fonctions déployées ; politique de nettoyage des images absente (CI-DEPLOIEMENT.md §3, à poser une fois par un humain)."
                return 0
              fi
              if grep -q "Aborting because deletion cannot proceed in non-interactive mode" "${log}"; then
                echo "::error::Des fonctions du projet n'existent pas dans ${LOT0_BRANCH} (liste ci-dessus). Relancer avec force=true seulement si leur suppression est voulue."
              fi
              return "${code}"
            fi
          }
          case "${TARGET}" in
            all) for t in functions firestore:rules hosting; do deploy_one "$t"; done ;;
            firestore-rules) deploy_one firestore:rules ;;
            functions) deploy_one functions ;;
            hosting) deploy_one hosting ;;
          esac

      - name: Résumé
        if: always()
        run: |
          {
            echo "### Déploiement Lot 0 : ${ENVIRONMENT}"
            echo "- projet : \`${PROJECT_ID}\`, base \`${DATABASE_ID}\`"
            echo "- cible : \`${TARGET}\` (force : ${FORCE})"
            echo "- code : \`${LOT0_BRANCH}@${LOT0_SHA}\`"
            echo "- workflow : \`${GITHUB_REF}@${GITHUB_SHA::7}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Même job, version « variables de dépôt préfixées » (forfait Free) : pas de
  # mot-clé `environment:`, mêmes permissions, variables et étapes (ancres YAML).
  deployer-sans-environnement:
    name: Déploiement Lot 0 sans environnement GitHub (${{ inputs.environment }} / ${{ inputs.target }})
    needs: [verifier, configuration]
    if: needs.configuration.outputs.mode == 'prefixe'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions: *deployer_permissions
    env: *deployer_env
    steps: *deployer_steps
