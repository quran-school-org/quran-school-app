# Intégration continue : lint, build, tests unitaires et tests sur émulateurs.
# AUCUN déploiement ici : la prod se déploie à la main (voir docs/runbooks/).
name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Garde-fou : tout se fait sur le projet de démonstration des émulateurs.
      GCLOUD_PROJECT: demo-quran-school
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      # Java est requis par l'émulateur Firestore.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - name: Cache des émulateurs Firebase
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}

      - name: Installation (application)
        run: npm ci

      - name: Installation (Cloud Functions)
        run: npm ci --prefix functions

      # Audit des dépendances (D45) : bloquant pour ce qui part en production,
      # informatif pour les outils de développement (firebase-tools…).
      - name: Audit des dépendances de production
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --omit=dev --audit-level=high --prefix functions

      - name: Audit complet (informatif)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Lint (tsc)
        run: npm run lint

      - name: Lint Cloud Functions (tsc)
        run: npm run lint:functions

      - name: Build de production
        run: npm run build

      - name: Build Cloud Functions
        run: npm run build:functions

      - name: Tests unitaires
        run: npm test

      - name: Tests sur émulateurs (règles Firestore, scripts)
        run: npm run test:rules

      # Rewrite Hosting /api/** → fonction api et en-têtes de sécurité (D48, D49).
      - name: Tests Hosting (rewrite /api, en-têtes)
        run: npm run test:hosting

  e2e:
    # Test de fumée Playwright contre les émulateurs (données fictives).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verifier
    env:
      GCLOUD_PROJECT: demo-quran-school
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - name: Cache des émulateurs Firebase
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}

      - name: Installation
        run: |
          npm ci
          npm ci --prefix functions

      - name: Navigateur Chromium pour Playwright
        run: npx playwright install --with-deps chromium

      - name: Tests de fumée (Playwright + émulateurs)
        run: npm run test:e2e

      - name: Traces en cas d'échec
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
