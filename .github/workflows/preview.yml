# Canal de prévisualisation Hosting par branche, sur le projet de DEV (D46, D68).
# PRÉPARÉ, INACTIF : déclenchement manuel uniquement, environnement GitHub
# `preview` (WIF, sans clé), dont le compte de service n'a que le rôle Hosting :
# un aperçu ne peut publier ni règles, ni fonctions, ni lire Firestore.
# Jamais sur la prod (garde-fou ci-dessous, et fournisseur WIF de la prod
# limité à l'environnement production, runbook CI-DEPLOIEMENT.md §2).
# Le canal sert le Hosting de la branche ; /api/** est réécrit vers la fonction
# `api` déjà déployée sur le projet de dev, Firestore et Auth sont ceux du dev.
# Durcissement (revue, D68) : build et tests dans un job SANS jeton OIDC ; le
# job de publication ne fait qu'installer la CLI (sans scripts npm) et publier.
name: Prévisualisation (dev, manuel)

on:
  workflow_dispatch:
    inputs:
      expires:
        description: "Durée de vie du canal (ex. 7d, 24h ; 30d maximum)"
        type: string
        default: 7d

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  construire:
    name: Build et tests unitaires (sans jeton OIDC)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview
    permissions:
      contents: read
    env:
      PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
    steps:
      - name: Garde-fous
        run: |
          set -euo pipefail
          [ -n "${PROJECT_ID}" ] || { echo "::error::Variable FIREBASE_PROJECT_ID absente de l'environnement preview."; exit 1; }
          case "${PROJECT_ID}" in demo-*|gen-lang-client-0481880143) echo "::error::Projet interdit pour un aperçu : ${PROJECT_ID}."; exit 1;; esac

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Configuration web du projet de dev
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIRESTORE_DATABASE_ID: ${{ vars.VITE_FIRESTORE_DATABASE_ID }}
          VITE_APPCHECK_SITE_KEY: ${{ vars.VITE_APPCHECK_SITE_KEY }}
        run: |
          {
            echo "VITE_FIREBASE_API_KEY=\"${VITE_FIREBASE_API_KEY}\""
            echo "VITE_FIREBASE_AUTH_DOMAIN=\"${VITE_FIREBASE_AUTH_DOMAIN}\""
            echo "VITE_FIREBASE_PROJECT_ID=\"${PROJECT_ID}\""
            echo "VITE_FIREBASE_STORAGE_BUCKET=\"${VITE_FIREBASE_STORAGE_BUCKET}\""
            echo "VITE_FIREBASE_MESSAGING_SENDER_ID=\"${VITE_FIREBASE_MESSAGING_SENDER_ID}\""
            echo "VITE_FIREBASE_APP_ID=\"${VITE_FIREBASE_APP_ID}\""
            echo "VITE_FIRESTORE_DATABASE_ID=\"${VITE_FIRESTORE_DATABASE_ID}\""
            echo "VITE_APPCHECK_SITE_KEY=\"${VITE_APPCHECK_SITE_KEY}\""
            echo 'VITE_USE_EMULATORS="false"'
            echo 'VITE_API_BASE_URL=""'
          } > .env.production.local

      - run: npm run build
      - run: npm test

      - name: Contrôle du projet visé par le bundle
        run: |
          set -euo pipefail
          grep -q "${PROJECT_ID}" dist/assets/*.js || { echo "::error::Le bundle ne vise pas ${PROJECT_ID}."; exit 1; }
          if grep -q "gen-lang-client-0481880143" dist/assets/*.js; then echo "::error::Bundle branché sur la prod."; exit 1; fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-apercu
          path: dist/
          retention-days: 1
          if-no-files-found: error

  apercu:
    name: Publication du canal d'aperçu
    needs: construire
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview
    permissions:
      contents: read
      id-token: write # jeton OIDC (fédération d'identité, compte Hosting seulement)
    env:
      PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Pas de cache partagé ; CLI Firebase seule, installée sans scripts npm.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-apercu
          path: dist/

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Canal de prévisualisation de la branche
        id: canal
        env:
          BRANCH: ${{ github.ref_name }}
          EXPIRES: ${{ inputs.expires }}
        run: |
          set -euo pipefail
          case "${PROJECT_ID}" in demo-*|gen-lang-client-0481880143) echo "::error::Projet interdit pour un aperçu : ${PROJECT_ID}."; exit 1;; esac
          [[ "${EXPIRES}" =~ ^[0-9]{1,3}[hd]$ ]] || { echo "::error::Durée invalide (ex. 7d, 24h)."; exit 1; }
          # Identifiant de canal : minuscules, chiffres et tirets, 36 caractères au plus.
          CHANNEL=$(echo "br-${BRANCH}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/-+/-/g; s/^-|-$//g' | cut -c1-36)
          npx firebase hosting:channel:deploy "${CHANNEL}" --expires "${EXPIRES}" \
            --project "${PROJECT_ID}" --non-interactive --json > canal.json
          URL=$(node -e 'const r=require("./canal.json");const v=Object.values(r.result||{})[0]||{};console.log(v.url||"")')
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "### Aperçu de \`${BRANCH}\` : ${URL} (expire dans ${EXPIRES})" >> "$GITHUB_STEP_SUMMARY"
