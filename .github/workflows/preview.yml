# Canal de prévisualisation Hosting par branche, sur le projet de DEV (D46, D68).
# PRÉPARÉ, INACTIF : déclenchement manuel uniquement, environnement GitHub
# `preview` (WIF, sans clé), dont le compte de service n'a que le rôle Hosting :
# un aperçu ne peut publier ni règles, ni fonctions, ni lire Firestore.
# Jamais sur la prod (garde-fou ci-dessous, et fournisseur WIF de la prod
# limité à l'environnement production, runbook CI-DEPLOIEMENT.md §2).
# Le canal sert le Hosting de la branche ; /api/** est réécrit vers la fonction
# `api` déjà déployée sur le projet de dev, Firestore et Auth sont ceux du dev.
# Durcissement (revue, D68) : build et tests dans un job SANS jeton OIDC ; le
# job de publication ne fait qu'installer la CLI (sans scripts npm) et publier.
# Forfait Free (D75) : les environnements GitHub n'existent pas sur un dépôt
# privé, donc ni l'environnement `preview` ni la condition de son fournisseur
# WIF (`assertion.environment == 'preview'`). Le job `disponibilite` arrête
# alors le workflow avec un message clair, avant tout job qui déclare
# `environment:` ; en Team ou Enterprise, rien ne change.
name: Prévisualisation (dev, manuel)

on:
  workflow_dispatch:
    inputs:
      expires:
        description: "Durée de vie du canal (ex. 7d, 24h ; 30d maximum)"
        type: string
        default: 7d

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  disponibilite:
    name: Aperçus disponibles (environnement GitHub preview)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Environnements GitHub disponibles ?
        env:
          USE_GITHUB_ENVIRONMENTS: ${{ vars.USE_GITHUB_ENVIRONMENTS }}
          DEV_PROJECT: ${{ vars.DEV_FIREBASE_PROJECT_ID }}
          PROD_PROJECT: ${{ vars.PROD_FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          # Même règle que deploy.yml, deploy-lot0.yml et ops.yml (job `configuration`).
          case "${USE_GITHUB_ENVIRONMENTS}" in
            true) MODE=environnement ;;
            false) MODE=prefixe ;;
            "") if [ -n "${DEV_PROJECT}${PROD_PROJECT}" ]; then MODE=prefixe; else MODE=environnement; fi ;;
            *) echo "::error::USE_GITHUB_ENVIRONMENTS doit valoir true, false, ou être absente."; exit 1 ;;
          esac
          if [ "${MODE}" != "environnement" ]; then
            echo "::error::Aperçus indisponibles : ce dépôt est configuré sans environnements GitHub (forfait Free, variables DEV_/PROD_). preview.yml exige l'environnement « preview » et son fournisseur WIF (guide, étape 2, bloc « aperçus »). Rien n'a été construit ni publié."
            echo "### Aperçus indisponibles sans environnements GitHub (forfait Free, D75)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Environnements GitHub utilisés : aperçu possible (environnement preview)."

  construire:
    name: Build et tests unitaires (sans jeton OIDC)
    needs: disponibilite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview
    permissions:
      contents: read
    env:
      PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
    steps:
      - name: Garde-fous
        run: |
          set -euo pipefail
          [ -n "${PROJECT_ID}" ] || { echo "::error::Variable FIREBASE_PROJECT_ID absente de l'environnement preview (à créer en Team ou Enterprise ; indisponible en Free, D75)."; exit 1; }
          case "${PROJECT_ID}" in demo-*|gen-lang-client-0481880143) echo "::error::Projet interdit pour un aperçu : ${PROJECT_ID}."; exit 1;; esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Configuration web du projet de dev
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIRESTORE_DATABASE_ID: ${{ vars.VITE_FIRESTORE_DATABASE_ID }}
          VITE_APPCHECK_SITE_KEY: ${{ vars.VITE_APPCHECK_SITE_KEY }}
        run: |
          {
            echo "VITE_FIREBASE_API_KEY=\"${VITE_FIREBASE_API_KEY}\""
            echo "VITE_FIREBASE_AUTH_DOMAIN=\"${VITE_FIREBASE_AUTH_DOMAIN}\""
            echo "VITE_FIREBASE_PROJECT_ID=\"${PROJECT_ID}\""
            echo "VITE_FIREBASE_STORAGE_BUCKET=\"${VITE_FIREBASE_STORAGE_BUCKET}\""
            echo "VITE_FIREBASE_MESSAGING_SENDER_ID=\"${VITE_FIREBASE_MESSAGING_SENDER_ID}\""
            echo "VITE_FIREBASE_APP_ID=\"${VITE_FIREBASE_APP_ID}\""
            echo "VITE_FIRESTORE_DATABASE_ID=\"${VITE_FIRESTORE_DATABASE_ID}\""
            echo "VITE_APPCHECK_SITE_KEY=\"${VITE_APPCHECK_SITE_KEY}\""
            echo 'VITE_USE_EMULATORS="false"'
            # Traduction française de TEST (D79) : l'aperçu vise le projet de dev.
            echo 'VITE_ENABLE_FR_TEST="true"'
          } > .env.production.local

      - run: npm run build
      - run: npm test

      - name: Contrôle du projet visé par le bundle
        run: |
          set -euo pipefail
          grep -q "${PROJECT_ID}" dist/assets/*.js || { echo "::error::Le bundle ne vise pas ${PROJECT_ID}."; exit 1; }
          if grep -q "gen-lang-client-0481880143" dist/assets/*.js; then echo "::error::Bundle branché sur la prod."; exit 1; fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-apercu
          path: dist/
          retention-days: 1
          if-no-files-found: error

  apercu:
    name: Publication du canal d'aperçu
    needs: construire
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview
    permissions:
      contents: read
      id-token: write # jeton OIDC (fédération d'identité, compte Hosting seulement)
    env:
      PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pas de cache partagé ; CLI Firebase seule, installée sans scripts npm.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-apercu
          path: dist/

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Canal de prévisualisation de la branche
        id: canal
        env:
          BRANCH: ${{ github.ref_name }}
          EXPIRES: ${{ inputs.expires }}
        run: |
          set -euo pipefail
          case "${PROJECT_ID}" in demo-*|gen-lang-client-0481880143) echo "::error::Projet interdit pour un aperçu : ${PROJECT_ID}."; exit 1;; esac
          [[ "${EXPIRES}" =~ ^[0-9]{1,3}[hd]$ ]] || { echo "::error::Durée invalide (ex. 7d, 24h)."; exit 1; }
          # Identifiant de canal : minuscules, chiffres et tirets, 36 caractères au plus.
          CHANNEL=$(echo "br-${BRANCH}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/-+/-/g; s/^-|-$//g' | cut -c1-36)
          npx firebase hosting:channel:deploy "${CHANNEL}" --expires "${EXPIRES}" \
            --project "${PROJECT_ID}" --non-interactive --json > canal.json
          URL=$(node -e 'const r=require("./canal.json");const v=Object.values(r.result||{})[0]||{};console.log(v.url||"")')
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "### Aperçu de \`${BRANCH}\` : ${URL} (expire dans ${EXPIRES})" >> "$GITHUB_STEP_SUMMARY"
